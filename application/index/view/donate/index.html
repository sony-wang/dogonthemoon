<form name="form" id="donate-form" class="form-vertical" method="POST" action="{:url('api/donate/donate')}">
    {:token()}
    <div class="form-group">
        <label for="donate_type" class="control-label col-xs-12 col-sm-2">捐款方式:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('donate_type', $donate_type_list, 1, ['class'=>'form-control', 'data-rule'=>'required'])}
        </div>
    </div>
    <div class="form-group">
        <label for="donate_amount" class="control-label col-xs-12 col-sm-2">捐款金額:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_select('donate_amount', $donate_amount_list, 0, ['class'=>'form-control', 'data-rule'=>'required'])}
        </div>
    </div>
    <div class="form-group">
        <label for="amount" class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <input type="number" class="form-control" id="amount" name="amount" value="1000" data-rule="required" placeholder="" autocomplete="off">
        </div>
    </div>
    <div class="form-group">
        <label for="phone" class="control-label col-xs-12 col-sm-2">手機號碼:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" class="form-control" id="phone" name="phone" value="" data-rule="required" placeholder="" autocomplete="off">
        </div>
    </div>
    <div class="form-group">
        <label for="donate_name" class="control-label col-xs-12 col-sm-2">捐款人:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" class="form-control" id="donate_name" name="donate_name" value="" data-rule="required" placeholder="" autocomplete="off">
        </div>
    </div>
    <div class="form-group">
        <button type="submit" class="btn btn-primary btn-lg btn-block">送出</button>
    </div>
</form>

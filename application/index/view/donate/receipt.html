<!DOCTYPE html>
<html>
  <head>
    {include file="common/meta" /}
    <!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
    <!--[if lt IE 9]>
      <script src="https://cdn.staticfile.org/html5shiv/3.7.3/html5shiv.min.js"></script>
      <script src="https://cdn.staticfile.org/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->
  </head>

  <body class="genSenRounded bg_a">
    <div class="row g-0">
      <div class="col-md-1">
        {include file="common/nav" /}
        </div>
        <div class="col-md-5 col-12 position-relative">
          <img
            style="top: 1rem; left: 25%; z-index: 99"
            class="logo position-absolute d-none d-md-block"
            src="__CDN__/assets/img/frontend/home page-流浪動物照護協會@2x.png"
            alt=""
          />
          <div class="m-md-5 p-md-5 d-flex flex-column min-vh-100" >
            <div class="flex-grow-1">
              <div class="d-flex ms-md-5 my-md-4">
                <div class="story d-flex justify-content-start align-items-center">
                  <img
                    style="max-height: 3.5rem"
                    src="__CDN__/assets/img/frontend/donate/捐款頁-捐款icon-@2x.png"
                    alt=""
                  />
                </div>
                <div class="w-100 d-flex align-items-center">
                  <p class="fs-custom-01 mb-0 genSenRounded">捐款</p>
                </div>
              </div>
              <div class="ms-md-5 my-md-4">
                <p style="color: #00000080;">林媽媽和全體照護員感謝您的愛心</p>
              </div>
            </div>
          </div>
        </div>
      <div class="col-md-6 col-12">
        <div class="container p-md-5">
          <div class="d-flex mb-4">
            <h2 class="me-3 position-relative">
              紙本抵稅收據
              <img style="max-height: 1.5rem;" src="__CDN__/assets/img/frontend/donate/捐款頁-紀錄查詢-向下箭頭@2x.png" alt="">
              <img class="position-absolute" style="max-height: 1rem; top: 2.5rem;left: 0;" src="__CDN__/assets/img/frontend/donate/组 323.png" alt="">
            </h2>
            <a class="text-decoration-none text-dark fs-3 ms-3" href="#" onclick="history.back()">
              回上一頁
              <img style="max-height: 1.5rem;" src="__CDN__/assets/img/frontend/donate/捐款頁-紀錄查詢-向上箭頭@2x.png" alt="">
            </a>
          </div>
          <form name="form" id="receipt-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="{:url('api/donate/donate')}">
            {:token()}
            <input type="hidden" id="donate_type" name="donate_type" value="3">
            <div class="form-group mt-3">
                <h4>填寫捐款基本資料
                  <img style="max-height: 1.5rem;" src="__CDN__/assets/img/frontend/donate/捐款頁-紀錄查詢-向下箭頭@2x.png" alt="">
                </h4>
                <p class="h6 text-secondary">若有捐款相關問題，我們可以儘速與您聯繫。</p>
            </div>
            <div class="form-group mt-3 row">
                <label for="donate_name" class="control-label col-xs-12 col-sm-2">您的姓名:</label>
                <div class="col-xs-12 col-sm-8">
                    <input type="text" class="form-control text-secondary bg-transparent border-start-0 border-end-0 border-top-0 rounded-0" id="donate_name" name="donate_name" value="" data-rule="required" placeholder="" autocomplete="off">
                </div>
            </div>
            <div class="form-group mt-3 row">
                <label for="phone" class="control-label col-xs-12 col-sm-2">聯絡手機:</label>
                <div class="col-xs-12 col-sm-8">
                    <input type="text" class="form-control text-secondary bg-transparent border-start-0 border-end-0 border-top-0 rounded-0" id="phone" name="phone" value="" data-rule="required" placeholder="" autocomplete="off">
                </div>
            </div>
            <div class="form-group mt-3 row">
                <label for="address" class="control-label col-xs-12 col-sm-2">郵寄地址:</label>
                <div class="col-xs-12 col-sm-8">
                    <input type="text" class="form-control text-secondary bg-transparent border-start-0 border-end-0 border-top-0 rounded-0" id="address" name="address" value="" data-rule="required" placeholder="" autocomplete="off">
                </div>
            </div>
            
            <div class="form-group mt-3">
              <div class="d-flex justify-content-end col-xs-12 col-sm-10">
                  <button id="receipt_submit" type="submit" class="btn text-dark display-1 fs-2">
                    送出  
                    <img style="max-height: 1.5rem;" src="__CDN__/assets/img/frontend/donate/捐款頁-捐款紀錄查詢icon@2x.png" alt="">
                  </button>
              </div>
            </div>
        </form>
        </div>
      </div>
    </div>
    {include file="common/script" /}
    <script>
      const donate_type_list = document.querySelectorAll('input[name="donate_type_list"]');
      const exec_times_wrap = document.querySelector('#exec_times_wrap');
      donate_type_list.forEach((element,index) => {
        element.checked = index === 0 ? true : false;
        element.addEventListener('change', (e)=>{
          if(document.querySelector('input[name="donate_type_list"]:checked').value === '2'){
            exec_times_wrap.style.display = 'block';
          } else {
            exec_times_wrap.style.display = 'none';
          }
        })
      });

      // const floatingSelect = document.querySelector('#floatingSelect');
      // const amount_wrap = document.querySelector('#amount_wrap');
      // const amount = document.querySelector('#amount');
      // console.log(floatingSelect)
      // floatingSelect.addEventListener('change', (e)=>{
      //   console.log(floatingSelect.value)
      //   if(floatingSelect.value == '0'){
      //     amount_wrap.style.display='block';
      //   } else {
      //     amount_wrap.style.display='none';
      //     amount.value = floatingSelect.value; //選擇自訂以外的數值則直接填上
      //   }
      // })
      
    </script>
  </body>

</html>

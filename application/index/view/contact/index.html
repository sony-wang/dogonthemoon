<!DOCTYPE html>
<html>
  <head>
    {include file="common/meta" /}
    <!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
    <!--[if lt IE 9]>
      <script src="https://cdn.staticfile.org/html5shiv/3.7.3/html5shiv.min.js"></script>
      <script src="https://cdn.staticfile.org/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->
  </head>

  <body class="genSenRounded bg_b">
    <div class="row g-0">
      <div class="col-md-1">
        {include file="common/nav" /}
        </div>
      <div class="col-md-5 col-12 position-relative">
        <img style="top: 1rem;left: 25%; z-index: 99;" class="logo position-absolute d-none d-md-block" src="__CDN__/assets/img/frontend/home page-流浪動物照護協會@2x.png" alt="">
        <div class="m-md-5 p-md-5 contact_left">
          <div class="d-flex ms-md-5 mt-md-4 ">
            <p class="fs-2 mb-0 genSenRounded">聯繫我們</p>
          </div>
          <p class="ms-md-5">電子郵箱: dogonthemoon644@gmail.com</p>
          <p class="ms-md-5" style="color:#00000080">
            請填寫右側表單
          </p>
          <img src="__CDN__/assets/img/frontend/contact/聯絡頁-底圖裝飾-@2x.png" alt="">
          <div class="d-flex justify-content-end my-3">
            <p class="fs-2">歡迎FB私訊</p>
            <img class="mx-3" style="width:5rem" src="__CDN__/assets/img/frontend/home/home page-follow us-箭頭-@2x.png" alt="">
            <a href="https://www.facebook.com/fullmoonstrayanimalsanctuary" target="_blank">
              <img style="max-width:3rem;max-height:3rem" src="__CDN__/assets/img/frontend/contact/聯絡頁-facebook icon@2x.png" alt="">
            </a>
          </div>
          
        </div>
      </div>
      <div class="col-md-6 col-12">
        <div class="container p-md-5">
          <form name="form" id="donate-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="{:url('api/contact/add')}">
            {:token()}
          <div class="form-group mt-3 row">
              <label for="name" class="control-label col-xs-12 col-sm-2">您的姓名:</label>
              <div class="col-xs-12 col-sm-8">
                  <input type="text" class="form-control text-secondary bg-transparent border-start-0 border-end-0 border-top-0 rounded-0" id="name" name="name" value="" data-rule="required" placeholder="" autocomplete="off">
              </div>
          </div>
          <div class="form-group mt-3 row">
              <label for="email" class="control-label col-xs-12 col-sm-2">EMAIL:</label>
              <div class="col-xs-12 col-sm-8">
                  <input type="text" class="form-control text-secondary bg-transparent border-start-0 border-end-0 border-top-0 rounded-0" id="email" name="email" value="" data-rule="required" placeholder="" autocomplete="off">
              </div>
          </div>
          <div class="form-group mt-3 row">
              <label for="phone" class="control-label col-xs-12 col-sm-2">聯繫電話:</label>
              <div class="col-xs-12 col-sm-8">
                  <input type="text" class="form-control text-secondary bg-transparent border-start-0 border-end-0 border-top-0 rounded-0" id="phone" name="phone" value="" data-rule="required" placeholder="" autocomplete="off">
              </div>
          </div>
          <div class="form-group mt-3 row">
              <label for="content" class="control-label col-xs-12 col-sm-2">留言訊息:</label>
              <div class="col-xs-12 col-sm-12 mt-3">
                  <textarea class="form-control text-secondary bg-white border border-3 rounded-4" id="content" name="content" value="" data-rule="required" placeholder="" autocomplete="off" rows="6"></textarea>
              </div>
          </div>
            
            <div class="mt-2 d-flex justify-content-start">
              <div style="background: url('__CDN__/assets/img/frontend/contact/聯絡頁-指示小狗@2x.png') ;height: 15rem;width: 15rem;background-position: top;background-size: cover;"></div>
              <!-- <img style="max-height: 12rem;" src="__CDN__/assets/img/frontend/contact/聯絡頁-指示小狗@2x.png" alt=""> -->
              <!-- <div class="d-flex justify-content-end col-xs-12 col-sm-10"> -->
                <button type="submit" class="btn text-dark display-1">
                  <h2>填寫完畢確認送出  
                    <img style="max-height: 1.5rem;" src="__CDN__/assets/img/frontend/volunteer/義工頁-填寫完成箭頭-right-@2x.png" alt="">
                  </h2>
                </button>
              <!-- </div> -->
            </div>
        </form>
        </div>
      </div>
    </div>
    {include file="common/script" /}
  </body>
</html>

<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}
    <input type="hidden" name="row[id]" value="{$row.id}">
    <div class="form-group">
        <label for="receipt" class="control-label col-xs-12 col-sm-2">{:__('Receipt')}:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[receipt]', ['0'=> __('Receipt 0'), '1'=> __('Receipt 1')], $row['receipt'])}
        </div>
    </div>


    <div class="form-group">
        <label for="status" class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[status]', ['0'=> __('Status 0'), '1'=> __('Status 1'), '2'=> __('Status 2')], $row['status'])}
        </div>
    </div>


    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>

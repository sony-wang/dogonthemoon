<form id="add-form" class="form-horizontal form-ajax" role="form" data-toggle="validator" method="POST" action="">
    {:token()}
    <div class="form-group">
        <label for="code" class="control-label col-xs-12 col-sm-2">{:__('code')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="code" data-rule="required" class="form-control" name="row[code]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label for="name" class="control-label col-xs-12 col-sm-2">{:__('name')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="name" data-rule="required" class="form-control" name="row[name]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label for="age" class="control-label col-xs-12 col-sm-2">{:__('age')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="age" data-rule="required" class="form-control" name="row[age]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label for="medical" class="control-label col-xs-12 col-sm-2">{:__('medical')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="medical" data-rule="required" class="form-control" name="row[medical]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label for="physical" class="control-label col-xs-12 col-sm-2">{:__('physical')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="physical" data-rule="required" class="form-control" name="row[physical]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('img')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="img"  class="form-control" size="50" name="row[img]" type="text" value="">
                <div class="input-group-addon no-border no-padding">
                    <span><button type="button" class="btn btn-danger faupload" data-rule="" data-input-id="img" data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp" data-multiple="true" data-preview-id="p-img"><i class="fa fa-upload"></i> 上傳照片</button></span>
                </div>
                <span class="msg-box n-right" for="img"></span>
            </div>
            <ul class="row list-inline faupload-preview" id="p-img"></ul>
        </div>
    </div>
    <div class="form-group">
        <label for="content" class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[status]', ['1'=> __('Status 1'), '0'=> __('Status 0')])}
        </div>
    </div>
    <div class="form-group hidden layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
